<style>
:root{
  /* ---- テーマで差し替わる「地」の色 ---- */
  --bg:#FDF7EE;
  --card:#FFFFFF;
  --card-soft:#FCFAF6;
  --ink:#4A4238;
  --sub:#9A8F82;
  --line:#EFE5D8;
  --kaki:#E8785A;
  --kaki-deep:#D5603F;
  --kaki-soft:#FBE9E2;
  /* ---- ステータスの色（意味を保つため全テーマ共通の色相） ---- */
  --midori:#5FA487;
  --midori-soft:#E5F2EC;
  --midori-ink:#347A5D;
  --sora:#6D9BC3;
  --sora-soft:#E8F0F7;
  --sora-ink:#3E6E9A;
  --kincha:#D9A441;
  --kincha-soft:#F8EDD5;
  --kincha-ink:#A87A22;
  --gray:#B4A99B;
  --gray-soft:#F3EEE6;
  --gray-ink:#7A6F60;
  --sumire:#9C87AC;
  --sumire-soft:#F1EBF5;
  --sumire-ink:#7C6690;
  --red:#D98A8A;
  --red-soft:#FAECEC;
  --red-ink:#B65A5A;
  --paper:#FFFDF8;
  --paper-ink:#B5872F;
  --toast-bg:#4A4238;
  --toast-ink:#FFFFFF;
  --radius:18px;
  --maru:'Zen Maru Gothic',sans-serif;
  --kiwi:'Kiwi Maru',serif;
}

/* ===== テーマ2：夜の劇場（ダーク） ===== */
[data-theme="yoru"]{
  --bg:#1E1B24;
  --card:#2A2632;
  --card-soft:#332E3C;
  --ink:#EDE6DC;
  --sub:#9C93A6;
  --line:#413B4D;
  --kaki:#E8785A;
  --kaki-deep:#C4523A;
  --kaki-soft:#3A2A2C;
  --midori-soft:#26382F;
  --midori-ink:#8FCBAF;
  --sora-soft:#25313D;
  --sora-ink:#9CC3E4;
  --kincha-soft:#3B3222;
  --kincha-ink:#E5BE6B;
  --gray-soft:#333039;
  --gray-ink:#B0A69C;
  --sumire-soft:#332B3B;
  --sumire-ink:#C4AED4;
  --red-soft:#3B2A2C;
  --red-ink:#E59A9A;
  --paper:#332B21;
  --paper-ink:#E5BE6B;
  --toast-bg:#4E4657;
  --toast-ink:#F5EFE6;
  --maru:'Zen Kaku Gothic New',sans-serif;
  --kiwi:'Shippori Mincho',serif;
}

/* ===== テーマ3：和紙（明朝・落ち着いた生成り） ===== */
[data-theme="washi"]{
  --bg:#F5F1E6;
  --card:#FFFDF7;
  --card-soft:#F7F3E9;
  --ink:#3D3A33;
  --sub:#8C8474;
  --line:#E2DACA;
  --kaki:#B5654A;
  --kaki-deep:#98503A;
  --kaki-soft:#F0E2DA;
  --paper:#FBF7EC;
  --toast-bg:#3D3A33;
  --maru:'Shippori Mincho',serif;
  --kiwi:'Shippori Mincho',serif;
}

/* ===== テーマ4：藍（涼やかな青） ===== */
[data-theme="ai"]{
  --bg:#F2F5F8;
  --card:#FFFFFF;
  --card-soft:#F7FAFC;
  --ink:#2E3A45;
  --sub:#7E8B99;
  --line:#DDE5EC;
  --kaki:#3D6E96;
  --kaki-deep:#2C5677;
  --kaki-soft:#E1EBF3;
  --paper:#FBFDFE;
  --toast-bg:#2E3A45;
  --maru:'Zen Kaku Gothic New',sans-serif;
  --kiwi:'Zen Kaku Gothic New',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--maru);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65}
button{font-family:var(--maru);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--maru);font-size:16px;width:100%;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--kaki)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 0 5px;letter-spacing:.03em}

header{background:var(--bg);padding:calc(16px + env(safe-area-inset-top)) 20px 6px;text-align:center}
header h1{font-family:var(--kiwi);font-weight:500;font-size:24px;letter-spacing:.2em;color:var(--kaki-deep)}
header h1 .tkt{display:inline-block;transform:rotate(-8deg);margin-right:6px}
header .tagline{font-size:11px;color:var(--sub);letter-spacing:.06em}

nav{display:flex;gap:6px;padding:10px 14px;position:sticky;top:0;z-index:50;background:var(--bg)}
nav button{flex:1;padding:9px 0;font-size:12.5px;font-weight:700;color:var(--sub);border-radius:14px;background:var(--card);border:2px solid var(--line)}
nav button .ic{display:block;font-size:17px;line-height:1.2}
nav button.on{color:#fff;background:var(--kaki);border-color:var(--kaki)}

main{padding:12px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.view{display:none}
.view.on{display:block}

.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.section-title{font-family:var(--kiwi);font-size:15px;color:var(--kaki-deep);margin:20px 0 10px;display:flex;align-items:center;gap:7px}
.section-title::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.empty{text-align:center;color:var(--sub);padding:30px 16px 34px;font-size:13.5px}
.empty .big{font-family:var(--kiwi);font-size:16px;color:var(--ink);display:block;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:16px;font-weight:700;font-size:14.5px}
.btn-primary{background:var(--kaki);color:#fff;width:100%;box-shadow:0 3px 0 var(--kaki-deep)}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--kaki-deep)}
.btn-ghost{border:2px solid var(--line);color:var(--ink);background:var(--card)}
.btn-danger{color:var(--kaki-deep);font-size:13px;padding:8px}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:12px}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));height:52px;padding:0 20px 0 18px;border-radius:26px;background:var(--kaki);color:#fff;font-size:14px;font-weight:700;box-shadow:0 4px 0 var(--kaki-deep),0 6px 16px rgba(213,96,63,.3);z-index:40;line-height:1;display:flex;align-items:center;gap:6px;white-space:nowrap}
.fab .plus{font-size:20px;line-height:1}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--kaki-deep)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--toast-bg);color:var(--toast-ink);font-size:13.5px;font-weight:700;padding:10px 22px;border-radius:24px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;pointer-events:auto}

.show-card{width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:15px 16px;margin-bottom:12px;position:relative}
.show-card .emoji{position:absolute;right:14px;top:13px;font-size:20px}
.show-card h3{font-family:var(--kiwi);font-size:16.5px;padding-right:34px}
.show-card .date{font-size:12px;color:var(--sub);margin-top:2px}
.gauge-wrap{margin-top:10px}
.gauge-label{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:4px}
.gauge-label b{color:var(--kaki-deep);font-size:13px}

  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= マスコット ================= */
const MASCOT=`<svg width="86" height="70" viewBox="0 0 86 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="margin-bottom:10px">
  <g transform="rotate(-6 43 35)">
    <path d="M8 16 h70 v10 a7 7 0 0 0 0 14 v10 h-70 v-10 a7 7 0 0 0 0-14 z" fill="#FBE9E2" stroke="#E8785A" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="56" y1="18" x2="56" y2="52" stroke="#E8785A" stroke-width="2" stroke-dasharray="3 4"/>
    <circle cx="27" cy="31" r="2.6" fill="#4A4238"/>
    <circle cx="43" cy="31" r="2.6" fill="#4A4238"/>
    <path d="M30 39 q5 5 10 0" stroke="#4A4238" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="22" cy="38" r="2.5" fill="#F4B9A4" opacity=".8"/>
    <circle cx="48" cy="38" r="2.5" fill="#F4B9A4" opacity=".8"/>
    <text x="66" y="40" font-size="11" text-anchor="middle" fill="#E8785A" font-weight="bold">★</text>
  </g>
</svg>`;

/* ================= グループ(親密度)定義 ================= */
const GRP={
  A:{label:'いつも応援',icon:'🔥',desc:'普段から仲がよく、積極的に応援してくれる方',cls:'gp-a'},
  B:{label:'顔なじみ',icon:'🌱',desc:'連絡が取りやすい方',cls:'gp-b'},
  C:{label:'これから',icon:'☁️',desc:'まだ面識が浅い、これから仲良くなる方',cls:'gp-c'}
};

/* ================= ステータス定義 ================= */
const ST={
  annai_mae:{label:'案内前',short:'案内前',cls:'bd-gray',phase:'pre',reserved:false},
  annai_zumi:{label:'案内済み',short:'案内済',cls:'bd-sora',phase:'pre',reserved:false},
  remind_zumi:{label:'リマインド済み',short:'リマインド',cls:'bd-sora',phase:'pre',reserved:false},
  kotowari:{label:'今回はお断り',short:'お断り',cls:'bd-sumire',phase:'pre',reserved:false},
  yoyaku_zumi:{label:'予約済み',short:'予約',cls:'bd-midori',phase:'pre',reserved:true},
  zenjitsu_zumi:{label:'前日案内済み',short:'前日案内',cls:'bd-midori',phase:'pre',reserved:true},
  cancel:{label:'キャンセル',short:'キャンセル',cls:'bd-red',phase:'both',reserved:false},
  orei_mae:{label:'お礼の挨拶前',short:'お礼前',cls:'bd-kincha',phase:'post',reserved:true},
  orei_zumi:{label:'お礼送信済み',short:'お礼済',cls:'bd-midori',phase:'post',reserved:true}
};
const PRE_KEYS=['annai_mae','annai_zumi','remind_zumi','kotowari','yoyaku_zumi','zenjitsu_zumi','cancel'];
const POST_KEYS=['orei_mae','orei_zumi','cancel'];
/* 行に直接並べるチップの並び（本番前／本番後） */
const PRE_ROW=['annai_mae','annai_zumi','remind_zumi','kotowari','yoyaku_zumi','zenjitsu_zumi','cancel'];
const POST_ROW=['yoyaku_zumi','orei_mae','orei_zumi','cancel'];
function chipKeys(past,cur){
  const base=(past?POST_ROW:PRE_ROW).slice();
  if(cur&&ST[cur]&&!base.includes(cur))base.unshift(cur);
  return base;
}
/* ================= スワイプでのステータス遷移ルール =================
   right: 右スワイプで進む先のステータスキー
   left : 左スワイプで進む先のステータスキー（'__exclude'はこの公演だけ対象外）
   指定のない方向はスワイプしても何も起きない（トーストで案内） */
const SWIPE_RULES={
  annai_mae:{right:'annai_zumi',left:'__exclude'},
  annai_zumi:{right:'yoyaku_zumi',left:'kotowari'},
  remind_zumi:{right:'yoyaku_zumi',left:'kotowari'},
  kotowari:{right:'yoyaku_zumi',left:'__exclude'},
  yoyaku_zumi:{right:'zenjitsu_zumi',left:'cancel'},
  zenjitsu_zumi:{left:'cancel'},
  cancel:{right:'yoyaku_zumi'},
};
/* ステータスチップを行に表示するか（端末に記憶） */
let showChips=(()=>{try{return localStorage.getItem('hanken_chips')!=='0';}catch(e){return true;}})();
function toggleChips(){
  showChips=!showChips;
  try{localStorage.setItem('hanken_chips',showChips?'1':'0');}catch(e){}
  const y=window.scrollY;renderShowDetail();window.scrollTo(0,y);
}
const isReserved=r=>ST[r.status]?ST[r.status].reserved:false;

/* ================= データ層 ================= */
const KEY='hanken_v3';
let memStore=null;
function migrate(d){
  (d.shows||[]).forEach(s=>{
    if(!s.stages||!s.stages.length){
      s.stages=[{id:'st_'+s.id,date:s.date||'',label:''}];
    }
  });
  (d.resv||[]).forEach(r=>{
    if(!r.stageId){
      const s=(d.shows||[]).find(x=>x.id===r.showId);
      if(s&&s.stages&&s.stages[0])r.stageId=s.stages[0].id;
    }
    /* 旧ステータス変換 */
    if(r.status==='yoyaku'||r.status==='torioki')r.status='yoyaku_zumi';
    if(r.status==='raijo')r.status='orei_mae';
    if(!ST[r.status])r.status='yoyaku_zumi';
  });
  (d.people||[]).forEach(p=>{
    /* 連絡先+SNS → 連絡方法へ統合 */
    if(p.sns!==undefined){
      p.contact=[p.contact,p.sns].filter(Boolean).join(' / ');
      delete p.sns;
    }
  });
  d.meta=d.meta||{};
  return d;
}
function loadData(){
  let d=null;
  try{

      if(old)d=JSON.parse(old);
    }
  }catch(e){}
  return migrate(d||memStore||{shows:[],people:[],resv:[],meta:{}});
}

  memStore=DB;

}

function toast(msg){

  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('on'),1700);
}
let lastAction=null;
function toastUndo(msg){
  const t=document.getElementById('toast');
  t.innerHTML=`${esc(msg)} <button onclick="undoLastAction()" style="margin-left:10px;text-decoration:underline;font-weight:700;color:inherit;background:none;border:none;padding:0;font-size:13px">元に戻す</button>`;
  t.classList.add('on');
  clearTimeout(t._tm);t._tm=setTimeout(()=>{t.classList.remove('on');lastAction=null;},4200);
}
function undoLastAction(){
  const a=lastAction;if(!a)return;
  if(a.type==='removeResv'){
    DB.resv=DB.resv.filter(x=>x.id!==a.resvId);
  }else if(a.type==='restoreResv'){
    DB.resv.push(a.resv);
  }else if(a.type==='unexclude'){
    const p=DB.people.find(x=>x.id===a.personId);if(p)p.excluded=false;
  }else if(a.type==='exclude'){
    const p=DB.people.find(x=>x.id===a.personId);if(p)p.excluded=true;
  }else if(a.type==='unexcludeShow'){
    const p=DB.people.find(x=>x.id===a.personId);if(p)p.excludeShows=(p.excludeShows||[]).filter(id=>id!==a.showId);
  }else if(a.type==='excludeShow'){
    const p=DB.people.find(x=>x.id===a.personId);if(p){p.excludeShows=p.excludeShows||[];if(!p.excludeShows.includes(a.showId))p.excludeShows.push(a.showId);}
  }
  lastAction=null;
  saveData();render();toast('元に戻しました');
}
/* 対象外の判定:全体(p.excluded)か、この公演だけ(p.excludeShows)か */
function isExcludedFor(p,showId){
  return !!p.excluded||(!!showId&&(p.excludeShows||[]).includes(showId));
}

/* ================= 並び替え(ヨミガナ・グループ・ステータス) ================= */
let sortMode=(()=>{try{return localStorage.getItem('hanken_sort')||'kana';}catch(e){return 'kana';}})();
let hideExcluded=false;
function setSortMode(m){
  sortMode=m;
  try{localStorage.setItem('hanken_sort',m);}catch(e){}
  render();

function toggleHideExcluded(){

/* ステータス順で使う並び。案内前に近いほど上、お断り・キャンセルは対応不要なので下 */
const STATUS_ORDER=['annai_mae','annai_zumi','remind_zumi','yoyaku_zumi','zenjitsu_zumi','orei_mae','orei_zumi','kotowari','cancel'];
function statusOrderIndex(p,stageId){
  const r=DB.resv.find(x=>x.personId===p.id&&x.stageId===stageId);
  const st=r?r.status:'annai_mae';
  const i=STATUS_ORDER.indexOf(st);
  return i===-1?STATUS_ORDER.length:i;
}
function sortPeople(list,showId){
  const arr=[...list];
  if(sortMode==='status'&&showId&&curStage){
    arr.sort((a,b)=>statusOrderIndex(a,curStage)-statusOrderIndex(b,curStage)||kanaKey(a).localeCompare(kanaKey(b),'ja'));
  }else if(sortMode==='group'){
    const ord={A:0,B:1,C:2,'':3};
    arr.sort((a,b)=>(ord[a.group||'']??3)-(ord[b.group||'']??3)||kanaKey(a).localeCompare(kanaKey(b),'ja'));
  }else{
    arr.sort((a,b)=>kanaKey(a).localeCompare(kanaKey(b),'ja'));
  }
  /* 対象外の方は常に最下部へ */
  arr.sort((a,b)=>(isExcludedFor(a,showId)?1:0)-(isExcludedFor(b,showId)?1:0));
  return arr;
}
function kanaKey(p){return p.kana||p.name||'';}
function sortBar(showId,withChipToggle){
  const excCount=DB.people.filter(p=>isExcludedFor(p,showId)).length;
  return `<div class="stage-scroller" style="padding-top:0">
    <button class="stage-chip ${sortMode==='kana'?'on':''}" onclick="setSortMode('kana')">あいうえお順</button>
    <button class="stage-chip ${sortMode==='group'?'on':''}" onclick="setSortMode('group')">グループ順</button>
    ${showId?`<button class="stage-chip ${sortMode==='status'?'on':''}" onclick="setSortMode('status')">ステータス順</button>`:''}
    ${withChipToggle?`<button class="stage-chip ${showChips?'on':''}" onclick="toggleChips()">🏷 ステータス${showChips?'表示中':'を表示'}</button>`:''}
    ${excCount?`<button class="stage-chip ${hideExcluded?'on':''}" onclick="toggleHideExcluded()">📵 対象外を${hideExcluded?'表示':'非表示'}（${excCount}人）</button>`:''}
  </div>`;
}

/* ================= 集計ヘルパー ================= */
function stagePriceOf(stageId,show){
  const s=show||DB.shows.find(x=>(x.stages||[]).some(st=>st.id===stageId));
  if(!s)return 0;
  const st=(s.stages||[]).find(x=>x.id===stageId);
  return (st&&Number(st.price)>0)?Number(st.price):Number(s.price)||0;
}
function showStats(s){
  const rs=DB.resv.filter(r=>r.showId===s.id&&isReserved(r));
  const tickets=rs.reduce((a,r)=>a+Number(r.count||0),0);
  const sales=rs.reduce((a,r)=>a+Number(r.count||0)*stagePriceOf(r.stageId,s),0);
  const paidSales=rs.filter(r=>r.paid).reduce((a,r)=>a+Number(r.count||0)*stagePriceOf(r.stageId,s),0);
  const rate=s.quota>0?Math.round(tickets/s.quota*100):null;
  return {tickets,sales,paidSales,rate};
}
function stageDateOf(stageId){
  for(const s of DB.shows){const st=(s.stages||[]).find(x=>x.id===stageId);if(st)return st.date||'';}
  return '';
}
function showStatsInYear(s,year){
  const rs=DB.resv.filter(r=>r.showId===s.id&&isReserved(r)&&stageDateOf(r.stageId).slice(0,4)===String(year));
  const tickets=rs.reduce((a,r)=>a+Number(r.count||0),0);
  const sales=rs.reduce((a,r)=>a+Number(r.count||0)*stagePriceOf(r.stageId,s),0);
  const paidSales=rs.filter(r=>r.paid).reduce((a,r)=>a+Number(r.count||0)*stagePriceOf(r.stageId,s),0);
  return {tickets,sales,paidSales};
}
function availableYears(){
  const ys=new Set();
  DB.shows.forEach(s=>(s.stages||[]).forEach(st=>{if(st.date)ys.add(st.date.slice(0,4));}));
  const arr=[...ys].sort((a,b)=>b.localeCompare(a));
  return arr.length?arr:[String(new Date().getFullYear())];
}

/* 日付を「8/28（木）」の形にする */
const WDAY=['日','月','火','水','木','金','土'];
function fmtDateW(d){
  if(!d)return'';
  const[y,m,dd]=d.split('-').map(Number);
  const w=new Date(y,m-1,dd);
  return `${m}/${dd}（${WDAY[w.getDay()]}）`;
}
function insertInfoTemplate(edit){

    const s=DB.shows.find(x=>x.id===edit);

    '開場は開演の30分前です。'
  ].join('\n');

function delShow(id){

function copyInfo(showId){
  const s=DB.shows.find(x=>x.id===showId);
  if(!s||!s.info)return;
  const done=()=>toast('公演情報をコピーしました📋');

    navigator.clipboard.writeText(s.info).then(done).catch(()=>fallbackCopy(s.info,done));
  }else{fallbackCopy(s.info,done);}

function fallbackCopy(text,done){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){toast('コピーできませんでした');}
  document.body.removeChild(ta);
}

function suggestMatches(s){
  const feats=(s.features||'').split(',').map(x=>x.trim()).filter(Boolean);
  if(!feats.length)return [];
  /* 未来のステージがない公演は提案しない */
  if(!(s.stages||[]).some(x=>!isPast(x)))return [];
  const out=[];
  DB.people.forEach(p=>{
    /* 対象外(全体・この公演)の方は提案しない */
    if(isExcludedFor(p,s.id))return;
    /* この公演のどこかのステージに記録がある人は除外(すでに案内・予約済み) */
    if(DB.resv.some(r=>r.showId===s.id&&r.personId===p.id))return;
    /* NG情報に特徴が一致したら除外 */
    if(p.ng&&feats.some(f=>p.ng.includes(f)))return;
    const text=[p.personal||'',...(p.memos||[]).map(m=>m.text)].join(' ');
    const hit=feats.filter(f=>text.includes(f));
    if(hit.length)out.push({p,hit});
  });
  const ord={A:0,B:1,C:2,'':3};
  out.sort((a,b)=>(ord[a.p.group||'']??3)-(ord[b.p.group||'']??3));
  return out;
}

/* ================= スワイプ操作(お客さまリスト) ================= */
function attachSwipeHandlers(containerSelector){
  const container=document.querySelector(containerSelector);
  if(!container||container.dataset.swipeAttached)return;
  container.dataset.swipeAttached='1';
  let startX=0,startY=0,curRow=null,dragging=false,locked=null,suppressUntil=0;
  const THRESH=68;
  container.addEventListener('touchstart',e=>{
    const row=e.target.closest('.roll-row, .person');
    if(!row||row.classList.contains('excluded'))return;
    curRow=row;startX=e.touches[0].clientX;startY=e.touches[0].clientY;dragging=true;locked=null;
    curRow.style.transition='none';
  },{passive:true});
  container.addEventListener('touchmove',e=>{
    if(!dragging||!curRow)return;
    const dx=e.touches[0].clientX-startX;
    const dy=e.touches[0].clientY-startY;
    if(locked===null)locked=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(locked==='y')return;
    curRow.style.transform=`translateX(${dx}px)`;
    curRow.style.background=dx>18?'var(--midori-soft)':dx<-18?'var(--gray-soft)':'';
  },{passive:true});
  container.addEventListener('touchend',()=>{
    if(!dragging||!curRow){dragging=false;return;}
    dragging=false;
    const m=(curRow.style.transform||'').match(/-?\d+\.?\d*/);
    const dx=m?parseFloat(m[0]):0;
    const row=curRow;
    row.style.transition='transform .2s ease';
    row.style.transform='translateX(0)';
    row.style.background='';
    curRow=null;
    if(locked!=='x')return;
    if(Math.abs(dx)>10)suppressUntil=Date.now()+350; /* この直後のタップ(クリック)は誤操作として無視 */
    const personId=row.dataset.person,showId=row.dataset.show,stageId=row.dataset.stage,resvId=row.dataset.resv;
    const status=row.dataset.status||'annai_mae';
    const rule=SWIPE_RULES[status]||null;
    if(dx>THRESH){
      if(rule&&rule.right){
        setStatusInline(personId,showId,stageId,resvId,rule.right);
      }else if(rule){
        toast('この状態では右スワイプの操作はありません');
      }else if(stageId&&!resvId){
        quickAdd(personId,showId,stageId);
      }else if(stageId){
        toast('これ以上進める操作はありません。⋯から変更できます');
      }
    }else if(dx<-THRESH){
      if(rule&&rule.left==='__exclude'){
        if(showId)toggleExcludeInline(personId,showId);
      }else if(rule&&rule.left){
        setStatusInline(personId,showId,stageId,resvId,rule.left);
      }else if(rule){
        toast('この状態では左スワイプの操作はありません。⋯から変更できます');
      }else if(showId){
        toggleExcludeInline(personId,showId); /* 公演の中からは、その公演だけ対象外 */
      }else{
        setExcluded(personId,true); /* 顧客タブからは、全体を対象外 */
      }
    }
  });
  container.addEventListener('click',e=>{
    if(Date.now()<suppressUntil){e.preventDefault();e.stopPropagation();}
  },true);
}

/* ステータス更新の本体。変更が起きたらtrueを返す */
function applyStatus(personId,showId,stageId,resvId,status){
  let r=resvId?DB.resv.find(x=>x.id===resvId):null;
  if(!r)r=DB.resv.find(x=>x.personId===personId&&x.stageId===stageId)||null;
  if(!r){
    if(status==='annai_mae')return false;
    r={id:uid(),showId,stageId,personId,count:1,status,paid:false,note:'',seat:''};
    DB.resv.push(r);
  }else if(status==='annai_mae'&&r.count<=1&&!r.paid&&!r.note){
    /* 案内前に戻す=レコード削除でスッキリ */
    DB.resv=DB.resv.filter(x=>x.id!==r.id);
  }else{
    if(r.status===status)return false;
    r.status=status;
  }
  saveData();return true;
}

function checkAfterShow(){
  /* 終演したステージで「予約済み/前日案内済み」の人 → お礼の挨拶前に更新を提案。お礼前の人がいれば知らせる */
  const pending=[];const oreimae=[];
  DB.shows.forEach(s=>(s.stages||[]).forEach(stg=>{
    if(!isPast(stg))return;
    DB.resv.filter(r=>r.stageId===stg.id).forEach(r=>{
      if(r.status==='yoyaku_zumi'||r.status==='zenjitsu_zumi')pending.push({r,s,stg});
      if(r.status==='orei_mae')oreimae.push({r,s,stg});
    });
  }));
  if(!pending.length&&!oreimae.length)return;
  const nm=id=>{const p=DB.people.find(x=>x.id===id);return p?p.name:'?';};
  openModal(`
    <h3>💌 本番、お疲れさまでした！</h3>
    ${pending.length?`<p style="font-size:13.5px;margin-top:8px">終演した回に、ステータスが「予約済み」のままの方が<b>${pending.length}人</b>います。来てくださった方を「お礼の挨拶前」に進めましょう。</p>
    <button class="btn btn-primary" style="margin-top:12px" onclick="bulkOrei()">まとめて「お礼の挨拶前」にする</button>`:''}
    ${oreimae.length?`<p style="font-size:13.5px;margin-top:14px">「お礼の挨拶前」の方が<b>${oreimae.length}人</b>います：</p>
    <div class="card" style="margin-top:8px;max-height:180px;overflow-y:auto">
      ${oreimae.slice(0,20).map(x=>`<div class="kv"><div class="k">${esc(nm(x.r.personId))}</div><div class="v" style="font-size:12.5px;color:var(--sub)">${esc(x.s.name)}・${esc(stageName(x.stg))}</div></div>`).join('')}
      ${oreimae.length>20?`<p class="note">ほか${oreimae.length-20}人</p>`:''}
    </div>
    <p class="note">お礼のメッセージを送ったら、リストのステータスを「お礼送信済み」に更新しましょう。この一手間が、次も来てもらえるいちばんの営業です😊</p>`:''}
    <div class="actions"><button class="btn btn-ghost" onclick="closeModal()">閉じる</button></div>
  `);
}
function bulkOrei(){
  let n=0;
  DB.shows.forEach(s=>(s.stages||[]).forEach(stg=>{
    if(!isPast(stg))return;
    DB.resv.filter(r=>r.stageId===stg.id).forEach(r=>{
      if(r.status==='yoyaku_zumi'||r.status==='zenjitsu_zumi'){r.status='orei_mae';n++;}
    });
  }));
  saveData();closeModal();render();toast(`${n}人を「お礼の挨拶前」にしました`);
  setTimeout(checkAfterShow,400);
}

function timeAgo(dateStr){
  if(!dateStr)return'';
  const d=Math.floor((new Date(today())-new Date(dateStr))/86400000);
  if(d<1)return'今日';
  if(d<31)return d+'日前';
  if(d<366)return Math.floor(d/30)+'ヶ月前';
  return Math.floor(d/365)+'年前';
}
function personStats(pid){
  const rs=DB.resv.filter(r=>r.personId===pid);
  const annai=rs.filter(r=>r.status!=='annai_mae').length; /* 何らかのアクションをした回数 */
  const visits=attendedCount(pid);
  const lastDate=visits.map(r=>{
    const s=DB.shows.find(x=>x.id===r.showId);
    const stg=s?(s.stages||[]).find(x=>x.id===r.stageId):null;
    return stg?stg.date:'';
  }).filter(Boolean).sort().pop()||'';
  return {annai,visits:visits.length,lastDate};
}
function attendedCount(pid){
  return DB.resv.filter(r=>{
    if(r.personId!==pid||!isReserved(r))return false;
    const s=DB.shows.find(x=>x.id===r.showId);
    const stg=s?(s.stages||[]).find(x=>x.id===r.stageId):null;
    return stg&&isPast(stg);
  });
}

/* ================= 名前の正規化・類似判定 ================= */
function normalizeName(name){
  let s=(name||'');
  s=s.replace(/\u3000/g,' '); // 全角スペース→半角
  s=s.replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)); // 全角英数→半角
  s=s.replace(/\s+/g,''); // スペース除去
  s=s.replace(/(様|さん|くん|ちゃん|氏)$/,''); // 敬称除去
  return s.trim();
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=a[i-1]===b[j-1]?prev[j-1]:1+Math.min(prev[j-1],prev[j],cur[j-1]);
    }
    prev=cur;
  }
  return prev[n];
}

function saveBulk(){
  const names=v('f_bulk').split('\n').map(x=>x.trim()).filter(Boolean);
  if(!names.length)return toast('お名前を入れてください');
  const existingNorm=new Map(DB.people.map(p=>[normalizeName(p.name),p]));
  let added=0,skipped=0;
  const newPeople=[];
  names.forEach(name=>{
    const norm=normalizeName(name);
    if(!norm)return;
    if(existingNorm.has(norm)){skipped++;return;} // 表記ゆれ込みで完全一致→自動スキップ
    const person={id:uid(),name,kana:'',contact:'',personal:'',ng:'',group:'',memos:[]};
    DB.people.push(person);
    existingNorm.set(norm,person);
    newPeople.push(person);
    added++;
  });
  saveData();
  /* 似ている名前(1文字違いなど)がないかチェック */
  const pairs=[];
  const seen=new Set();
  newPeople.forEach(np=>{
    const npNorm=normalizeName(np.name);
    DB.people.forEach(op=>{
      if(op.id===np.id)return;
      const key=[np.id,op.id].sort().join('-');
      if(seen.has(key))return;
      const opNorm=normalizeName(op.name);
      if(opNorm===npNorm)return; // 完全一致は既にスキップ済のはず
      const dist=levenshtein(npNorm,opNorm);
      const maxLen=Math.max(npNorm.length,opNorm.length);
      if(maxLen>=2&&dist<=1){
        pairs.push({newP:np,otherP:op});
        seen.add(key);
      }
    });
  });
  if(pairs.length){
    showSimilarReview(pairs,added,skipped);
  }else{
    closeModal();render();
    toast(`${added}人を登録しました${skipped?`（${skipped}人は登録済みのためスキップ）`:''}`);
  }
}

    <p class="sub">${added}人を登録しました${skipped?`（${skipped}人は登録済みのためスキップ）`:''}。念のため、似た名前をご確認ください。</p>

  DB.resv=DB.resv.filter(r=>r.personId!==newId); /* 今登録したばかりなので通常は紐づく予約はない */
  saveData();
  const card=document.getElementById(cardId);
  if(card){card.innerHTML='<p style="font-size:13px;color:var(--sub)">統合しました。</p>';}
  toast('統合しました');

}

function cheerComment(totalQ,totalT){
  if(!totalQ)return 'あなたが出演したことで動いたお金です。この数字は、あなたを観たい人がいる証です🌸';
  const rate=Math.round(totalT/totalQ*100);
  if(rate>=100)return `目標達成、おめでとうございます🎉 あなたが出演したことで、これだけのお金が動きました。堂々と胸を張ってください！`;
  if(rate>=70)return `目標まであと少し（${rate}%）！あなたが出演したことで動いたお金です。ラストスパート、応援しています📣`;
  if(rate>=30)return `折り返し地点（${rate}%）。あなたが出演したことで動いたお金です。案内・リマインドの一声が数字を動かします💪`;
  return `ここからが本番（${rate}%）。あなたが出演したことで動くお金です。まずは「案内を送ろう」の一人目から😊`;
}
function renderSummary(){
  const el=document.getElementById('view-summary');
  const years=availableYears();
  if(!years.includes(sumYear))sumYear=years[0];
  const isYear=sumMode==='year';
  const shownShows=isYear?DB.shows.filter(s=>(s.stages||[]).some(st=>(st.date||'').slice(0,4)===sumYear)):DB.shows;
  const statOf=s=>isYear?showStatsInYear(s,sumYear):showStats(s);
  const totalSales=shownShows.reduce((a,s)=>a+statOf(s).sales,0);
  const totalTickets=shownShows.reduce((a,s)=>a+statOf(s).tickets,0);
  const withQuota=shownShows.filter(s=>s.quota>0);
  const totalQ=withQuota.reduce((a,s)=>a+s.quota,0);
  const totalT=withQuota.reduce((a,s)=>a+statOf(s).tickets,0);
  const peopleInScope=isYear?new Set(DB.resv.filter(r=>isReserved(r)&&stageDateOf(r.stageId).slice(0,4)===sumYear).map(r=>r.personId)).size:DB.people.length;
  el.innerHTML=`
    <div class="stage-scroller" style="padding-top:0">
      <button class="stage-chip ${sumMode==='cumulative'?'on':''}" onclick="sumMode='cumulative';renderSummary()">累計集計</button>
      <button class="stage-chip ${sumMode==='year'?'on':''}" onclick="sumMode='year';renderSummary()">年間集計</button>
      ${isYear?years.map(y=>`<button class="stage-chip ${sumYear===y?'on':''}" onclick="sumYear='${y}';renderSummary()">${y}年</button>`).join(''):''}
    </div>
    <div class="sum-hero"><span class="deco">🎫</span><div class="t">動いたお金（${isYear?sumYear+'年の':'全公演の'}売上見込）</div><div class="n">${yen(totalSales)}</div>
      <p style="font-size:12px;line-height:1.7;margin-top:8px;opacity:.95">${cheerComment(totalQ,totalT)}</p>
      <p style="font-size:10.5px;opacity:.7;margin-top:6px">※チケット売上の見込額であり、あなたの収入（ギャラ）とは異なります。</p>
    </div>
    <div class="sum-row">
      <div class="sum-box"><div class="ic">👥</div><div class="t">${isYear?'来場のあった方':'顧客数'}</div><div class="n">${peopleInScope}<small>人</small></div></div>
      <div class="sum-box"><div class="ic">🎫</div><div class="t">総予約枚数</div><div class="n">${totalTickets}<small>枚</small></div></div>
      <div class="sum-box"><div class="ic">📅</div><div class="t">公演数</div><div class="n">${shownShows.length}<small>本</small></div></div>
    </div>
    <div class="section-title">🎯 公演別の集客状況</div>
    ${shownShows.length?[...shownShows].sort((a,b)=>firstDate(b).localeCompare(firstDate(a))).map(s=>{
      const st=statOf(s);
      const rate=s.quota>0?Math.round(st.tickets/s.quota*100):null;
      return `<div class="card">
        <b style="font-family:var(--kiwi)">${esc(s.name)}</b>
        <div style="font-size:12px;color:var(--sub)">${firstDate(s)?fmtDate(firstDate(s))+'〜':'日程未定'}　全${(s.stages||[]).length}ステージ</div>
        ${s.quota>0?`<div class="gauge-wrap">
          <div class="gauge-label"><span>集客目標 ${s.quota}枚</span><b>${st.tickets}枚（${rate}%）${rate>=100?'🎉':''}</b></div>
          <div class="gauge"><i class="${rate>=100?'full':''}" style="width:${Math.min(rate,100)}%"></i></div>
        </div>`:`<div class="show-stats"><span>予約 <b>${st.tickets}</b>枚</span></div>`}
        <div class="show-stats"><span>💰 売上見込 <b>${yen(st.sales)}</b></span><span>✅ 入金済 <b>${yen(st.paidSales)}</b></span></div>
      </div>`;
    }).join(''):`<div class="empty">${MASCOT}${isYear?sumYear+'年の公演記録はまだありません。':'公演を登録すると、ここに集客状況が並びます。'}</div>`}`;
}

function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='hanken_backup_'+today()+'.json';
  a.click();
  toast('バックアップを書き出しました💾');
}
function importData(input){
  const f=input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d.shows||!d.people||!d.resv)throw 0;
      if(!confirm('現在のデータを読み込んだ内容で置き換えます。よろしいですか？'))return;
      DB=migrate(d);saveData();render();toast('データを読み込みました');
    }catch(e){toast('ファイルを読み込めませんでした');}
  };
  rd.readAsText(f);
  input.value='';
}
function resetAll(){
  if(!confirm('すべての公演・顧客・予約データを削除します。元に戻せません。よろしいですか？'))return;
  if(!confirm('本当に削除しますか？（バックアップの書き出しをおすすめします）'))return;
  DB={shows:[],people:[],resv:[],meta:{guideSeen:true}};saveData();render();toast('データを削除しました');
}

    <div class="guide-step"><div class="no">2</div><div class="gs-body"><p><b>📅 公演を登録</b><br>公演名と単価、集客目標を登録。上演回（ステージ）は「10/12 昼」「10/12 19:00」のように何回でも追加できます。<b>公演の特徴</b>（怪談、朗読 など）を入れると、その言葉に合うお客さまを提案します。<b>ひな形を入れる</b>を押すと、公演名・日時・料金が入った案内文の下書きができます。会場などを書き足せば、ワンタップでコピーしてお客さまへの案内に使えます。</p></div></div>
    <div class="guide-step"><div class="no">3</div><div class="gs-body"><p><b>✓ 案内して、予約チェック</b><br>公演を開くと、<b>「この方に案内を送ろう！」</b>と半券がおすすめの方を挙げます。公演の特徴とお客さまの好みが一致した、まだ案内していない方です。お名前をタップして案内を送ったら「案内済み」に。<br>ステージを選ぶとお客さまリストが出ます。<b>○をタップするだけで予約1枚</b>。お名前の下のステータスのチップは<b>タップした瞬間に切り替わります</b>。「案内済み→リマインド→予約済み→前日案内→お礼」まで、丁寧なフォローが習慣になります。行を<b>左右にスワイプ</b>すれば、いまの状態に応じて次に進めます（例：案内済みは右で予約済み、左で今回はお断り）。並び替えの<b>「ステータス順」</b>を使うと、対応が必要な人が自然と上に来ます。</p><div class="guide-shot"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCADaAjADASIAAhEBAxEB/8QAGgABAQEBAQEBAAAAAAAAAAAAAAMBAgQFBv/EABcBAQEBAQAAAAAAAAAAAAAAAAABAwL/2gAMAwEAAhADEAAAAf2YsIksiLIiyIsiLIiyIsiLIiyIsiLIiyIsiLIiyIsiLIiyIsiLIiyIsiLIiyIsiLIiyIsiLIiyIsiLIiwVG0U71wdsw6SnZ6UBdDg9Tz8nqeapR5ey7OFonQJaUcadAAAAAAAAAAAAAAAAAAAAAnaNhG0YpKpZddoj4vpuufDnvV4fN9cfJ36pPm9+8vxPZ7yRl60vn9Avnj7ieWtQCgAAAAAAAAAAAAAAAAAAATtGwjaMU472sW+Nnr9NX4WmX2Hy9s+m82S+p57Gd28hUAAAAAAAAAAAAAAAAAAAAAAAAAE7RsI2jFDivT870M+/V8z0tOIbYdcaPRxLYrF3QAAAAAAAAAAAAAAAAAAAAAAAAAE7RsI2jFOevLXoebD18x4PT1876BmTmerrzXNcclU+SyGl85mWzMN3z6ehCh254LT68h6t8tS3GRLV+f7TpMUT5LbChu+cehxI9OIlsnpRxE9G+fD0PJUo88z3vP0W2HZu+epTeeido2EbRinPUKtz15y+R09GZAvsOi3GQPVkaHWSw9HMMPT15rG9SHew7O+pUN5eU9Lz9ltlhfnkdsiV3x1LbAejZCiQrz15T0vN0W3y9npznDvZ0AAAAAAJ2jYRtGKGVrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrBrNJ2jYRtGKSr4r16/PXxp6O5Yl+JTPZ15uyqeFNnp1SNwAAAAAAAAAAAAAAAAAAAAAAAACdo2EbRihzRPodywq3zlkMPTzxwX7hQ3ZYUcabvksWyeFKeWxu84UT6OueR2n0U4wUzng3iXnPfvmHrefD05Porkx1sKlM5wpsh31Ps0AAAAAE7RsI2jFDmtzkd7LozvnDU+S3HGFuueCux6O+p9k+vNUtnIolp24w62WFc5wpseS2ccle8gW2NDrqPZRzyddSqAAAAAAAAAAATtGwjaMUOaTnmWvpbLXKmc8nfEMLej5ntLc5hvcuS2cTK7HSvUKHWw7KbMOvJYr1PDtyKgAAAAAAAAAAAAAAAAnaNhGyXlNZRMlExRMUTFExRMUTFExRMUTFExRMUTFExRMUTFExRMUTFExRMUTFExRMUTFExRMUTFExRMUTFEwtmygoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH/8QALBAAAg /* ================= テーマ（見た目の切り替え） ================= */
const THEMES={
  komorebi:{name:'木漏れ日',desc:'やわらかな生成りと柿色。半券のきほんの見た目です。',bar:['#FDF7EE','#E8785A','#5FA487'],meta:'#FDF7EE'},
  yoru:{name:'夜の劇場',desc:'目にやさしい暗い画面。楽屋や客席で開くときに。',bar:['#1E1B24','#E8785A','#8FCBAF'],meta:'#1E1B24'},
  washi:{name:'和紙',desc:'明朝体の落ち着いた雰囲気。読み物のような佇まい。',bar:['#F5F1E6','#B5654A','#8C8474'],meta:'#F5F1E6'},
  ai:{name:'藍',desc:'涼やかな青で、すっきり整った印象に。',bar:['#F2F5F8','#3D6E96','#7E8B99'],meta:'#F2F5F8'}
};
let theme=(()=>{try{return localStorage.getItem('hanken_theme')||'komorebi';}catch(e){return 'komorebi';}})();
function applyTheme(t){
  if(!THEMES[t])t='komorebi';
  theme=t;
  if(t==='komorebi')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',THEMES[t].meta);
  try{localStorage.setItem('hanken_theme',t);}catch(e){}
}
function setTheme(t){
  applyTheme(t);
  renderSettings();
  toast(`「${THEMES[t].name}」にしました`);
}
applyTheme(theme);

/* ================= 起動 ================= */
render();
if(!DB.meta||!DB.meta.guideSeen){
  setTimeout(openGuide,400);
}else{
  setTimeout(checkAfterShow,400);
}
</script>
</body>
</html>
